name: Offline development preview APK
on:
  pull_request:
    branches: ['feat/*', develop, main]
    paths:
      - 'apps/mobile/**'
      - 'scripts/*preview*'
      - '.github/workflows/dev-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  KASHYAP_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Verify release exclusion and native build hooks
        run: python3 -m unittest discover -s scripts -p test_preview_build.py
      - name: Locked dependencies and preview regression tests
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test test/dev_preview_test.dart --dart-define=ENABLE_DEV_PREVIEW=true --reporter expanded
      - name: Build independent offline preview and verify release rejection
        run: python3 scripts/build_dev_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nepali-bansawali-offline-preview-${{ github.run_id }}
          path: test-results/dev-preview/
          if-no-files-found: error
          retention-days: 14
  preview-device-acceptance:
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: nepali-bansawali-offline-preview-${{ github.run_id }}
          path: test-results/dev-preview
      - run: cd apps/mobile && flutter pub get --enforce-lockfile
      - name: Verify isolated emulator SDK archives
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/offline-preview-android-user"
          printf 'ANDROID_USER_HOME=%s\n' "$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          python3 scripts/android-sdk-preflight.py
      - name: Enable isolated emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-dev-preview-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-preview-native-evidence-${{ github.run_id }}
          path: |
            test-results/dev-preview-device/
            test-results/android-sdk-*
          if-no-files-found: error
          retention-days: 14
  build-usb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: cd apps/mobile && flutter pub get --enforce-lockfile
      - name: Verify physical-device build admission
        run: python3 -m unittest discover -s scripts -p test_usb_test.py
      - name: Build separate loopback USB integration APK
        run: python3 scripts/build_usb_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nepali-bansawali-usb-integration-${{ github.run_id }}
          path: test-results/usb-test/
          if-no-files-found: error
          retention-days: 14
