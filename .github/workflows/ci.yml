name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test Backend, Contracts & Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies (Strict Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @kashyap/contracts run build
          pnpm --filter @kashyap/localization run build
          pnpm --filter @kashyap/design-tokens run build
          pnpm --filter @kashyap/test-fixtures run build

      - name: Build NestJS API Backend
        run: pnpm --filter @kashyap/api run build

      - name: Run Backend Unit & Integration Tests
        run: pnpm --filter @kashyap/api test

      - name: Build Next.js Admin Portal
        run: pnpm --filter @kashyap/admin run build
