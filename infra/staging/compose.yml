name: kashyap-staging

# Run with --env-file pointing to the approved host-only secret configuration.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set an approved PostgreSQL 16 image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: kashyap_staging
      POSTGRES_USER: kashyap_staging
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ${STAGING_DATA_ROOT:?Set STAGING_DATA_ROOT}/postgres:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kashyap_staging -d kashyap_staging']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:?Set an approved Redis 7 image digest}
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD}']
    volumes:
      - ${STAGING_DATA_ROOT}/redis:/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: ${MINIO_IMAGE:?Set an approved MinIO image digest}
    restart: unless-stopped
    command: [server, /data, --certs-dir, /certs, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - ${STAGING_DATA_ROOT}/minio:/data
      - ${STAGING_SECRET_ROOT:?Set STAGING_SECRET_ROOT}/minio-tls:/certs:ro
    networks: [private]

  storage-init:
    image: ${MINIO_MC_IMAGE:?Set an approved MinIO client image digest}
    restart: 'no'
    depends_on: [minio]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        attempts=0
        until mc alias set staging https://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempts=$$((attempts+1))
          test "$$attempts" -lt 30
          sleep 2
        done
        mc mb --ignore-existing staging/kashyap-staging
        mc anonymous set none staging/kashyap-staging
        mc version enable staging/kashyap-staging
        mc admin user add staging "$$MEDIA_ACCESS_KEY" "$$MEDIA_SECRET_KEY"
        cat > /tmp/media-policy.json <<'POLICY'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:ListBucketVersions","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::kashyap-staging"]},{"Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion","s3:PutObject","s3:DeleteObject","s3:DeleteObjectVersion"],"Resource":["arn:aws:s3:::kashyap-staging/*"]}]}
        POLICY
        mc admin policy create staging staging-media /tmp/media-policy.json
        mc admin policy attach staging staging-media --user "$$MEDIA_ACCESS_KEY"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?Set MEDIA_ACCESS_KEY}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?Set MEDIA_SECRET_KEY}
    volumes:
      - ${STAGING_SECRET_ROOT}/minio-ca.crt:/root/.mc/certs/CAs/minio-ca.crt:ro
    networks: [private]

  clamav:
    image: ${CLAMAV_IMAGE:?Set an approved ClamAV 1.4 image digest}
    restart: unless-stopped
    volumes:
      - ${STAGING_DATA_ROOT}/clamav:/var/lib/clamav
    networks: [private, outbound]
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  api:
    image: ${API_IMAGE:?Set the reviewed API image digest}
    restart: unless-stopped
    init: true
    env_file: ${STAGING_SECRET_ROOT}/api.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: kashyap_staging
      DB_NAME: kashyap_staging
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MEDIA_STORAGE_BACKEND: s3
      MEDIA_S3_ENDPOINT: https://minio:9000
      MEDIA_S3_BUCKET: kashyap-staging
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_FORCE_PATH_STYLE: 'true'
      AWS_ACCESS_KEY_ID: ${MEDIA_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_SECRET_KEY}
      NODE_EXTRA_CA_CERTS: /run/secrets/minio-ca.crt
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      CORS_ORIGINS: ${STAGING_ADMIN_URL:?Set the exact admin HTTPS origin}
      SEED_ADMINS: 'false'
    ports: ['127.0.0.1:3010:3000']
    volumes:
      - ${STAGING_SECRET_ROOT}/minio-ca.crt:/run/secrets/minio-ca.crt:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      clamav: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    networks: [private, outbound]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

networks:
  private: {internal: true}
  outbound: {}
